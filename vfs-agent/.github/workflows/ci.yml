name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vfs-agent/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./vfs-agent
      
      - name: Run lint
        run: npm run lint
        working-directory: ./vfs-agent
      
      - name: Run type check
        run: npx tsc --noEmit
        working-directory: ./vfs-agent
      
      - name: Build
        run: npm run build
        working-directory: ./vfs-agent
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: vfs-agent/out
          retention-days: 7